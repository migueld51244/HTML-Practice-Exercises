<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Tags</title>
</head>
<body>
    <h1>Input Tags</h1>
    <p>Text Input Tags</p>

    <label for="name">Nome</label>
    <input id="name" type="text" name="user-name" placeholder="e.g João" required>

    <label for="birth-date">Data de nascimento</label>
    <input id="birth-date" type="date" name="date" placeholder="e.g 12/11/2011" required>

    <label for="email">E-Mail</label>
    <input id="email"type="email" name="user-email" placeholder="e.g pedro124@gmail.com" required>

    <label for="password">Password</label>
    <input id="password" type="password" name="user-password" required>
</body>
</html>
