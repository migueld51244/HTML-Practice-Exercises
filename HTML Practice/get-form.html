<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrieve Info</title>
</head>
<body>
    <h1>Request your info</h1>

    <p>The porpouse of this page is to create a form that allows to retrieve content from the database.</p>

    <form action="/api/v1/accounts" method="get">
        <label for="name">Type your user name</label>
        <input type="text" id="name" name="name">

        <label for="">Email</label>
        <input type="email" id="email" name="email">

        <label for="why">Tell us the reason</label>
        <textarea name="why" id="why" placeholder="Why do you want the data for?"></textarea>

        <label for="date-created">When was it created</label>
        <select name="year-of-creation" id="date-created">
            <option value="2020">2020</option>
            <option value="2021">2021</option>
            <option value="2022">2022</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
        </select>

        <label for="lang">Language (optional)</label>
        <input type="text" id="lang">

        <button type="submit">Get!</button>
    </form>
</body>
</html>
