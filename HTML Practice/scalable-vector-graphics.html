<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVGs</title>
</head>
<body>
    <p>There are 2 ways to insert SGVs</p>

    <ul>
        <li>Inline</li>
        <li>IMG Element</li>
    </ul>

    <h2>Inline SVGs</h2>
    <svg xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512">
        <path d="M368 415.86V72a24.07 24.07 0 00-24-24H72a24.07 24.07 0 00-24 24v352a40.12 40.12 0 0040 40h328" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="32"/><path d="M416 464h0a48 48 0 01-48-48V128h72a24 24 0 0124 24v264a48 48 0 01-48 48z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="32"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" d="M240 128h64M240 192h64M112 256h192M112 320h192M112 384h192"/><path d="M176 208h-64a16 16 0 01-16-16v-64a16 16 0 0116-16h64a16 16 0 0116 16v64a16 16 0 01-16 16z"/>
    </svg>
    <p>This way it just needs it's code right here, grabbed from a text editor</p>

    <h2>Via IMG Element</h2>
    <img src="/SVG/logo-facebook.svg" alt="Facebook Logo">
    <p>This way it's like inserting a normal image, requiring the SVG to be saved on the Hard Drive</p>
</body>
</html>
