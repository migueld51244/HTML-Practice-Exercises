<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
</head>
<body>
    <h1>Button</h1>
    <p>Buttons trigger actions such as submitting a form</p>

    <h2>Apply for home job!</h2>
    <label for="t1">Choose</label>
    <select name="test" id="t1">
        <option value="below18">Minor</option>
        <option value="over18">Adult</option>
    </select>

    <button type="reset">Reset</button>
    <button type="submit">Proceed</button>
</body>
</html>
